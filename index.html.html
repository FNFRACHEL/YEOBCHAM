<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>주녀비와 Let's Play!</title>
<style>
  :root{
    --ink:#4B1528;
    --pink-bg:#FFE3EF;
    --pink-soft:#FFC9DE;
    --pink-hot:#FF5FA2;
    --pink-deep:#E8367F;
    --cream:#FFF7FB;
    --win:#25A56A;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;
    background:
      radial-gradient(circle at 15% 12%, #FFD1E6 0%, transparent 32%),
      radial-gradient(circle at 88% 20%, #FFC0DB 0%, transparent 30%),
      radial-gradient(circle at 80% 88%, #FFD8EA 0%, transparent 35%),
      radial-gradient(circle at 10% 85%, #FFCBE1 0%, transparent 30%),
      var(--pink-bg);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    position:relative;
  }
  /* floating deco emojis */
  .deco{
    position:fixed;font-size:26px;opacity:.5;pointer-events:none;
    animation:float 6s ease-in-out infinite;
    z-index:0;
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(-6deg)}
    50%{transform:translateY(-14px) rotate(6deg)}
  }
  .stage{
    width:100%;max-width:430px;height:100dvh;max-height:940px;
    display:flex;flex-direction:column;
    padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    position:relative;z-index:1;
  }
  .brand{
    text-align:center;
    font-size:17px;font-weight:900;
    color:var(--pink-deep);
    margin-bottom:4px;
    line-height:1.5;
    text-shadow:0 1px 0 #fff;
  }
  .brand .emoji-row{
    display:block;font-size:15px;letter-spacing:2px;
  }
  .brand .title-line{
    display:block;font-size:19px;letter-spacing:.02em;
  }
  .photo-frame{
    flex:1;min-height:0;
    border-radius:26px;overflow:hidden;
    border:3px solid #fff;
    outline:2.5px solid var(--pink-hot);
    box-shadow:0 10px 24px rgba(232,54,127,.28);
    background:#fff;
    position:relative;
  }
  .photo-frame img{
    width:100%;height:100%;object-fit:cover;object-position:center 20%;
    display:block;
  }
  .frame-crown{
    position:absolute;top:-4px;left:50%;transform:translateX(-50%);
    font-size:34px;
    filter:drop-shadow(0 2px 3px rgba(75,21,40,.25));
    z-index:2;
  }
  .shake{animation:shake .45s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px) rotate(-1deg)}
    40%{transform:translateX(8px) rotate(1deg)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }
  .bubble{
    margin:14px 4px 12px;
    text-align:center;
    font-size:20px;font-weight:800;line-height:1.45;
    min-height:62px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .bubble .big{
    font-size:36px;letter-spacing:.06em;color:var(--pink-deep);
    text-shadow:0 2px 0 #fff;
  }
  .pop{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .controls{display:flex;gap:14px}
  .arrow-btn{
    flex:1;padding:16px 0 14px;
    font-family:inherit;
    background:var(--cream);color:var(--ink);
    border:2.5px solid var(--pink-hot);border-radius:20px;
    box-shadow:0 5px 0 var(--pink-hot);
    cursor:pointer;
    transition:transform .08s, box-shadow .08s;
    touch-action:manipulation;
  }
  .arrow-btn .hand{display:block;font-size:44px;line-height:1.1}
  .arrow-btn small{
    display:block;font-size:13px;font-weight:800;letter-spacing:.2em;
    margin-top:4px;color:var(--pink-deep);
  }
  .arrow-btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--pink-hot)}
  .arrow-btn:disabled{opacity:.4;pointer-events:none}
  .yes-btn{
    width:100%;padding:18px 0;
    font-size:22px;font-weight:900;letter-spacing:.1em;
    font-family:inherit;
    background:linear-gradient(180deg,var(--pink-hot),var(--pink-deep));
    color:#fff;
    border:2.5px solid #fff;border-radius:20px;
    box-shadow:0 6px 0 var(--pink-deep), 0 10px 20px rgba(232,54,127,.35);
    cursor:pointer;
    transition:transform .08s, box-shadow .08s;
    touch-action:manipulation;
  }
  .yes-btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--pink-deep)}
  .replay-btn{
    width:100%;padding:16px 0;
    font-size:17px;font-weight:900;letter-spacing:.25em;
    font-family:inherit;
    background:linear-gradient(180deg,var(--pink-hot),var(--pink-deep));
    color:#fff;
    border:2.5px solid #fff;border-radius:20px;
    box-shadow:0 6px 0 var(--pink-deep), 0 10px 20px rgba(232,54,127,.35);
    cursor:pointer;
    transition:transform .08s, box-shadow .08s;
    touch-action:manipulation;
  }
  .replay-btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--pink-deep)}
  .hidden{display:none !important}
  .result-badge{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    padding:9px 22px;border-radius:999px;
    border:2.5px solid #fff;
    font-size:15px;font-weight:900;letter-spacing:.1em;
    animation:pop .35s cubic-bezier(.2,1.6,.4,1);
    white-space:nowrap;
    box-shadow:0 4px 12px rgba(75,21,40,.25);
    z-index:2;
  }
  .result-badge.win{background:var(--win);color:#fff}
  .result-badge.lose{background:var(--pink-deep);color:#fff}
  .score{
    text-align:center;font-size:13px;font-weight:800;
    color:var(--pink-deep);letter-spacing:.1em;
    margin-top:10px;
    text-shadow:0 1px 0 #fff;
  }
</style>
</head>
<body>
<!-- floating background emojis -->
<span class="deco" style="top:6%;left:5%;animation-delay:0s">🎀</span>
<span class="deco" style="top:12%;right:6%;animation-delay:1.2s">💖</span>
<span class="deco" style="top:38%;left:3%;animation-delay:2s">👑</span>
<span class="deco" style="top:45%;right:4%;animation-delay:.6s">🌸</span>
<span class="deco" style="top:68%;left:6%;animation-delay:1.6s">✨</span>
<span class="deco" style="top:75%;right:5%;animation-delay:2.4s">🦄</span>
<span class="deco" style="bottom:8%;left:12%;animation-delay:.9s">💕</span>
<span class="deco" style="bottom:5%;right:12%;animation-delay:1.8s">🧁</span>

<div class="stage">
  <div class="brand">
    <span class="emoji-row">🎀💖👑✨🌸🦄🍓💕🧁💗</span>
    <span class="title-line">🌷 주녀비와 Let's Play! 🌷</span>
    <span class="emoji-row">💗🧁💕🍓🦄🌸✨👑💖🎀</span>
  </div>

  <div class="photo-frame" id="frame">
    <div class="frame-crown">👑</div>
    <img id="photo" src="" alt="주녀비">
    <div class="result-badge hidden" id="badge"></div>
  </div>

  <div class="bubble" id="bubble"></div>

  <button class="yes-btn" id="btnYes">네! 좋아요 💕</button>

  <div class="controls hidden" id="controls">
    <button class="arrow-btn" id="btnLeft" disabled>
      <span class="hand">👈</span><small>LEFT</small>
    </button>
    <button class="arrow-btn" id="btnRight" disabled>
      <span class="hand">👉</span><small>RIGHT</small>
    </button>
  </div>
  <button class="replay-btn hidden" id="btnReplay">REPLAY 🎀</button>

  <div class="score" id="score"></div>
</div>

};

const photo = document.getElementById('photo');
const frame = document.getElementById('frame');
const bubble = document.getElementById('bubble');
const badge = document.getElementById('badge');
const btnYes = document.getElementById('btnYes');
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnReplay = document.getElementById('btnReplay');
const controls = document.getElementById('controls');
const scoreEl = document.getElementById('score');

let wins = 0, losses = 0, locked = true;

function setBubble(html){
  bubble.innerHTML = html;
  bubble.classList.remove('pop');
  void bubble.offsetWidth;
  bubble.classList.add('pop');
}

function showIntro(){
  locked = true;
  badge.classList.add('hidden');
  btnReplay.classList.add('hidden');
  controls.classList.add('hidden');
  btnYes.classList.remove('hidden');
  photo.src = IMG.front;
  setBubble('안녕하세요! 🥰<br>저와 참참참을 해볼까요?');
}

function startRound(){
  locked = true;
  btnYes.classList.add('hidden');
  controls.classList.remove('hidden');
  btnLeft.disabled = true;
  btnRight.disabled = true;

  setBubble('<span class="big">참.참.참! 💥</span>');
  frame.classList.remove('shake');
  void frame.offsetWidth;
  frame.classList.add('shake');

  setTimeout(()=>{
    btnLeft.disabled = false;
    btnRight.disabled = false;
    locked = false;
  }, 450);
}

function pick(playerDir){
  if(locked) return;
  locked = true;
  btnLeft.disabled = true;
  btnRight.disabled = true;

  const cpuDir = Math.random() < 0.5 ? 'left' : 'right';
  photo.src = IMG[cpuDir];

  const win = playerDir === cpuDir;
  if(win){ wins++; } else { losses++; }

  setTimeout(()=>{
    badge.textContent = win ? '👑 YOU WIN' : '💅 I WIN';
    badge.className = 'result-badge ' + (win ? 'win' : 'lose');
    setBubble(win
      ? '🎉 당신이 이겼습니다! 💖'
      : '😝 에이궁~ 제가 이겼네요!');
    controls.classList.add('hidden');
    btnReplay.classList.remove('hidden');
    scoreEl.textContent = '💖 WIN ' + wins + '  ·  LOSE ' + losses + ' 💔';
  }, 250);
}

btnYes.addEventListener('click', startRound);
btnLeft.addEventListener('click', ()=>pick('left'));
btnRight.addEventListener('click', ()=>pick('right'));
btnReplay.addEventListener('click', showIntro);

showIntro();
</script>
