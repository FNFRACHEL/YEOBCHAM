<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FROST LINK — ZERO DEGREE</title>
<style>
:root{
  --apricot:#F2C9A4; --mint:#A9D6C6; --ice:#CFE7EE; --deepice:#7FD8EC;
  --paper:#F6F3EE; --ink:#16191C; --heat:#FF7A55;
  --deep:#0A2634; --deep2:#0E3547;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--deep)}
body{font-family:var(--mono);color:#EAF6FA;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}

/* ── HUD ───────────────────────────────────────────── */
#hud{position:absolute;top:0;left:0;right:0;padding:22px 22px 0;color:#EAF6FA;
  text-shadow:0 2px 10px rgba(4,20,30,.8)}
#hud[hidden]{display:none}
#hud .row{display:flex;justify-content:space-between;align-items:baseline}
#hud .time b{font-size:40px;letter-spacing:-.04em;font-weight:600;color:#FFFFFF}
#hud .time span{font-size:9px;letter-spacing:.26em;color:#7E9CAB;margin-left:7px}
#hud .time.low b{color:var(--heat)}
#hud .temp{font-size:24px;letter-spacing:-.03em;color:var(--deepice)}
#hud .row2{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
#hud .score{font-size:16px;letter-spacing:.04em;color:#CFE7EE}
#hud .stage{font-size:9px;letter-spacing:.26em;color:#7E9CAB}
#hud .stage b{font-size:15px;color:var(--deepice);margin-left:4px}
#hud .track{margin-top:9px;height:3px;background:rgba(226,248,255,.18);border-radius:2px;overflow:hidden}
#hud .track i{display:block;height:100%;width:0%;background:var(--deepice);
  border-radius:2px;box-shadow:0 0 10px rgba(127,216,236,.9);transition:width .2s}
#hud .bestrow{display:flex;align-items:baseline;gap:8px;margin-top:6px;
  font-size:9px;letter-spacing:.26em;color:#6E8B9A}
#hud .bestrow b{font-size:13px;letter-spacing:-.01em;color:#8FAEBD}
#hud .bestrow.ahead{color:var(--deepice)}
#hud .bestrow.ahead b{color:var(--deepice)}

.flash{position:absolute;left:0;right:0;top:17%;text-align:center;font-size:19px;
  letter-spacing:.3em;color:#FFFFFF;opacity:0;transition:opacity .18s;
  text-shadow:0 2px 14px rgba(4,20,30,.95)}

/* ── 화면 ──────────────────────────────────────────── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:40px 28px 54px;pointer-events:auto;
  background:linear-gradient(to top,rgba(8,32,44,.97) 16%,rgba(8,32,44,.72) 58%,rgba(8,32,44,.15))}
.screen[hidden]{display:none}
.screen h1{font-size:clamp(50px,16vw,86px);line-height:.84;letter-spacing:-.055em;
  font-weight:700;color:#FFFFFF;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.screen p{margin-top:18px;font-size:12px;line-height:1.9;letter-spacing:.2em;color:#A8C6D3}
.screen button{margin-top:28px;align-self:flex-start;font-family:var(--mono);font-size:12px;
  letter-spacing:.3em;color:var(--deep);background:var(--deepice);border:0;padding:17px 30px;
  cursor:pointer;box-shadow:0 0 26px rgba(127,216,236,.45)}
.head{font-size:10px;letter-spacing:.3em;color:#7E9CAB}
.final{font-size:68px;line-height:1;letter-spacing:-.05em;font-weight:700;color:#FFFFFF;margin:4px 0 20px}
.stats{display:flex;gap:26px}
.stats div span{display:block;font-size:9px;letter-spacing:.24em;color:#6E8B9A}
.stats div b{font-size:26px;font-weight:600;letter-spacing:-.04em;color:#EAF6FA}
.kicker{font-size:9px;letter-spacing:.34em;color:var(--deepice);margin-bottom:12px}
.lineup{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:18px}
.lineup span{font-size:9px;letter-spacing:.1em;color:#6E8B9A}
.lineup span i{font-style:normal;color:#4E6B7A}
.lineup span.rare{color:#E2B25C}
.lineup span.rare i{color:#B5893F}
.newbest{display:inline-block;align-self:flex-start;font-size:10px;letter-spacing:.3em;
  color:var(--deep);background:var(--deepice);padding:7px 12px;margin-bottom:12px;
  box-shadow:0 0 22px rgba(127,216,236,.6)}
.newbest[hidden]{display:none}

/* 결과 화면은 글자가 많아 판 위에 겹치면 읽기 힘들다 — 더 진하게 덮는다 */
.screen[data-over]{background:linear-gradient(to top,
  rgba(8,32,44,.99) 44%,rgba(8,32,44,.95) 62%,rgba(8,32,44,.7) 82%,rgba(8,32,44,.25))}

#hud .mission{margin-top:7px;font-size:10px;letter-spacing:.2em;color:#BFE6F2}
#hud .mission span{color:var(--deepice)}
#nick{margin-top:22px;width:100%;max-width:280px;background:rgba(255,255,255,.08);
  border:1px solid rgba(190,238,250,.35);color:#EAF6FA;font-family:var(--mono);
  font-size:14px;letter-spacing:.22em;padding:14px 16px;text-transform:uppercase;
  pointer-events:auto}
#nick::placeholder{color:#5E7E8E;letter-spacing:.22em}
#nick:focus{outline:none;border-color:var(--deepice);background:rgba(127,216,236,.12)}
.entry{display:flex;gap:26px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(190,238,250,.18)}
.entry div span{display:block;font-size:9px;letter-spacing:.24em;color:#6E8B9A}
.entry div b{font-size:15px;letter-spacing:.1em;color:var(--deepice)}
.entrynote{margin-top:12px;font-size:9px;letter-spacing:.18em;color:#6E8B9A}

/* 소리 켜기/끄기 — 오른쪽 아래 구석, 판을 가리지 않게 작게 */
.sound{position:absolute;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;
  pointer-events:auto;font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:#BFE6F2;
  background:rgba(10,38,52,.55);border:1px solid rgba(190,238,250,.3);padding:8px 10px;cursor:pointer}
.sound.off{color:#6E8B9A;border-color:rgba(190,238,250,.14)}

</style>
</head>

  // 캐릭터 난입은 한 번에 하나만 보여준다 — 겹치면 글자가 두 개 뜨고 화면이 두 번 죽는다
  function dropCharFx() {
    for (let i = fx.length - 1; i >= 0; i--) {
      if (fx[i].t === 'rush' || fx[i].t === 'drop') fx.splice(i, 1);
    }
  }

  function onEvents(events) {
    for (const e of events) {
      if (e.kind === 'clear') {
        for (const cell of e.cells) burst(cell.c, cell.r, '#CFE7EE', 5, 130, 0.42);
        shake = Math.max(shake, Math.min(7, e.cells.length * 0.35));
      } else if (e.kind === 'blast') {
        crackBurst();
        const x = cx(e.c), y = cy(e.r);
        fx.push({ t: 'ring', x, y, r0: ts * 0.3, r1: ts * (e.special === 'bomb' ? 5.5 : 4),
                  life: 0.5, max: 0.5, color: '#FFFFFF' });
        fx.push({ t: 'ring', x, y, r0: ts * 0.2, r1: ts * (e.special === 'bomb' ? 4.2 : 3),
                  life: 0.62, max: 0.62, color: '#2F93AD' });
        if (e.special === 'line') {
          fx.push({ t: 'beam', x: 0, y, w: W, h: ts * 0.9, life: 0.4, max: 0.4 });
        } else if (e.special === 'cross') {
          fx.push({ t: 'beam', x: 0, y, w: W, h: ts * 0.9, life: 0.45, max: 0.45 });
          fx.push({ t: 'vbeam', x, y: 0, w: ts * 0.9, h: H, life: 0.45, max: 0.45 });
        }
        burst(e.c, e.r, '#FFFFFF', e.special === 'bomb' ? 26 : 18, 330, 0.75);
        burst(e.c, e.r, '#2F93AD', 12, 220, 0.6);
        shake = Math.max(shake, e.special === 'bomb' ? 22 : 15);
        flash = Math.max(flash, e.special === 'bomb' ? 0.55 : 0.35);
        fx.push({ t: 'word', text: e.special === 'bomb' ? 'BOOM' : e.special === 'cross' ? 'CROSS' : 'LINE',
                  x: W / 2, y: y - ts, life: 0.7, max: 0.7, size: 34 });
      } else if (e.kind === 'meowrush') {
        dropCharFx();
        fx.push({ t: 'rush', img: `meow_${e.char}`, y: cy(e.r), x: -ts * 2,
                  life: 0.92, max: 0.92, text: 'MEOW RUSH' });
        shake = Math.max(shake, 24);
        flash = Math.max(flash, 0.5);
      } else if (e.kind === 'bunnydrop') {
        dropCharFx();
        fx.push({ t: 'drop', img: `bunny_${e.char}`, x: cx(e.c), y: -ts * 2,
                  vy: 0, life: 1.05, max: 1.05, text: 'BUNNY DROP', hit: false });
        shake = Math.max(shake, 20);
      } else if (e.kind === 'combo') {
        crackBurst();
        setCrack(crackLevel + 0.12);
        const x = cx(e.c), y = cy(e.r);
        for (let k = 0; k < 3; k++) {
          fx.push({ t: 'ring', x, y, r0: ts * 0.2, r1: Math.max(W, H) * (0.6 + k * 0.28),
                    life: 0.55 + k * 0.18, max: 0.55 + k * 0.18,
                    color: k % 2 ? '#2F93AD' : '#FFFFFF' });
        }
        burst(e.c, e.r, '#FFFFFF', 36, 420, 0.95);
        shake = Math.max(shake, 30);
        flash = Math.max(flash, 0.75);
        fx.push({ t: 'word', text: e.label, x: W / 2, y: H * 0.32, life: 1.0, max: 1.0, size: 38 });
      } else if (e.kind === 'icebreak') {
        burst(e.c, e.r, '#DFF6FD', 9, 210, 0.5);
        fx.push({ t: 'ring', x: cx(e.c), y: cy(e.r), r0: ts * 0.2, r1: ts * 1.2,
                  life: 0.32, max: 0.32, color: '#FFFFFF' });
        shake = Math.max(shake, 5);
      } else if (e.kind === 'frozenblock') {
        fx.push({ t: 'ring', x: cx(e.c), y: cy(e.r), r0: ts * 0.35, r1: ts * 0.62,
                  life: 0.26, max: 0.26, color: '#9FD8EA' });
      } else if (e.kind === 'douse') {
        for (let i = 0; i < 8; i++) {
          fx.push({ t: 'p', x: cx(e.c) + (i - 4) * 3, y: cy(e.r), vx: (i - 4) * 16, vy: -90 - i * 6,
                    r: 4 + (i % 3), color: '#FFFFFF', life: 0.5, max: 0.5, rot: 0, spin: 2 });
        }
      } else if (e.kind === 'cascade') {
        fx.push({ t: 'word', text: `CHAIN x${e.n}`, x: W / 2, y: H * 0.3, life: 0.8, max: 0.8, size: 30 });
        shake = Math.max(shake, 6 + e.n * 2);
      } else if (e.kind === 'stage') {
        teamKey = CFG.USE_TEAM_LOGOS && e.team ? e.team.key : null;
        const z = e.mission && e.mission.zone;
        fx.push({ t: 'banner', text: z ? z.name : `STAGE ${e.n}`,
                  sub: z ? z.line : (e.team ? e.team.name.toUpperCase() : ''),
                  logo: CFG.USE_TEAM_LOGOS && e.team ? `t_${e.team.key}` : null,
                  life: 1.8, max: 1.8 });
        flash = Math.max(flash, 0.45);
      } else if (e.kind === 'snowblast') {
        const x = cx(e.c), y = cy(e.r);
        fx.push({ t: 'ring', x, y, r0: ts * 0.2, r1: Math.max(W, H), life: 0.7, max: 0.7, color: '#FFFFFF' });
        fx.push({ t: 'ring', x, y, r0: ts * 0.1, r1: Math.max(W, H) * 0.8, life: 0.85, max: 0.85, color: '#2F93AD' });
        for (let i = 0; i < 40; i++) {
          const a = (i / 40) * Math.PI * 2;
          fx.push({ t: 'p', x, y, vx: Math.cos(a) * (260 + i * 6), vy: Math.sin(a) * (260 + i * 6) - 80,
                    r: 4 + (i % 4) * 2, color: '#FFFFFF', life: 0.9, max: 0.9, rot: a, spin: 5 });
        }
        shake = Math.max(shake, 26);
        flash = Math.max(flash, 0.65);
        fx.push({ t: 'word', text: 'WHITE OUT', x: W / 2, y: H * 0.34, life: 0.9, max: 0.9, size: 34 });
      } else if (e.kind === 'meltdown') {
        crackBurst();
        for (let k = 0; k < 3; k++) {
          fx.push({ t: 'ring', x: W / 2, y: H * 0.6, r0: ts * 0.3,
                    r1: Math.max(W, H) * (0.7 + k * 0.3),
                    life: 0.6 + k * 0.2, max: 0.6 + k * 0.2, color: '#FF7A45' });
        }
        for (let i = 0; i < 40; i++) {
          const a = (i / 40) * Math.PI * 2;
          fx.push({ t: 'p', x: W / 2, y: H * 0.6, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380 - 120,
                    r: 4 + (i % 4) * 2, color: '#FF8A50', life: 0.9, max: 0.9, rot: a, spin: 7 });
        }
        fx.push({ t: 'word', text: 'MELTDOWN', x: W / 2, y: H * 0.34, life: 1.1, max: 1.1, size: 40 });
        fx.push({ t: 'word', text: `\u221212s`, x: W / 2, y: H * 0.42, life: 1.1, max: 1.1, size: 26 });
        shake = Math.max(shake, 34);
        heatFlash = 1;
      } else if (e.kind === 'fever') {
        fx.push({ t: 'banner', text: 'FEVER', sub: 'HEAT STOPPED \u00B7 SCORE x2', logo: null,
                  life: 1.5, max: 1.5 });
        for (let i = 0; i < 28; i++) {
          const a = (i / 28) * Math.PI * 2;
          fx.push({ t: 'p', x: W / 2, y: H * 0.55, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300 - 100,
                    r: 3 + (i % 3) * 2, color: '#BFEEFA', life: 0.8, max: 0.8, rot: a, spin: 5 });
        }
        flash = Math.max(flash, 0.55);
        shake = Math.max(shake, 14);
      } else if (e.kind === 'newbest') {
        fx.push({ t: 'banner', text: 'NEW BEST', sub: '', logo: null, life: 1.3, max: 1.3 });
        fx.push({ t: 'word', text: 'NEW BEST', x: W / 2, y: H * 0.3, life: 1.0, max: 1.0, size: 36 });
        flash = Math.max(flash, 0.6);
        shake = Math.max(shake, 18);
      } else if (e.kind === 'snowfall') {
        fx.push({ t: 'banner', text: 'SNOWFALL', life: 1.6, max: 1.6 });
        flash = Math.max(flash, 0.7);
      }
    }
  }

  const FX_MAX = 200;   // 폰에서 프레임이 떨어지지 않게 상한을 둔다

  function setCrack(level) { crackLevel = Math.max(crackLevel, Math.min(1, level)); }

  function stepFx(dt) {
    crackFlash = Math.max(0, crackFlash - dt * 2.4);
    heatFlash = Math.max(0, heatFlash - dt * 1.8);
    if (fx.length > FX_MAX) {
      // 파티클만 버린다. 예전엔 오래된 것부터 잘라서 캐릭터 난입·배너 같은
      // 큰 연출이 파티클에 밀려 사라졌다.
      let over = fx.length - FX_MAX;
      for (let i = 0; i < fx.length && over > 0; i++) {
        if (fx[i].t === 'p') { fx.splice(i, 1); i--; over--; }
      }
    }
    time += dt;
    shake = Math.max(0, shake - dt * 46);
    flash = Math.max(0, flash - dt * 2.2);
    for (const f of fx) {
      f.life -= dt;
      if (f.t === 'p') {
        f.vy += 900 * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.rot += f.spin * dt;
      } else if (f.t === 'word') {
        f.y -= 34 * dt;
      } else if (f.t === 'rush') {
        f.x += (W + ts * 4) / f.max * dt;
      } else if (f.t === 'drop') {
        if (!f.hit) {
          f.vy += 5200 * dt;
          f.y += f.vy * dt;
          if (f.y >= H * 0.55) { f.hit = true; f.y = H * 0.55; }
        }
      }
    }
    for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1);
  }

  // ── 타일 ──────────────────────────────────────────────────────
  function snowCrystal(x, y, size, alpha, scale) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x + size / 2, y + size / 2);
    ctx.scale(scale, scale);
    const R = size * 0.36;
    const pulse = 0.9 + Math.sin(time * 5) * 0.1;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.5);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(1, 'rgba(207,231,238,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, R * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(47,147,173,0.9)';
    ctx.shadowBlur = 10;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + time * 0.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * R * pulse, Math.sin(a) * R * pulse);
      ctx.moveTo(Math.cos(a) * R * 0.5, Math.sin(a) * R * 0.5);
      ctx.lineTo(Math.cos(a + 0.55) * R * 0.8, Math.sin(a + 0.55) * R * 0.8);
      ctx.moveTo(Math.cos(a) * R * 0.5, Math.sin(a) * R * 0.5);
      ctx.lineTo(Math.cos(a - 0.55) * R * 0.8, Math.sin(a - 0.55) * R * 0.8);
      ctx.stroke();
    }
    ctx.restore();
  }

  let teamKey = null;   // 이번 단계의 홈팀 로고

  function beanie(t, x, y, size, alpha, scale, lineup) {
    if (t.type < 0) { snowCrystal(x, y, size, alpha, scale); return; }
    const prod = lineup[t.type];
    const im = prod ? img[`b_${prod.id}`] : null;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x + size / 2, y + size / 2);
    ctx.scale(scale, scale);

    if (t.fire > 0) {
      // 불 — 붉은 오라와 위로 타오르는 혀
      const pulse = 0.82 + Math.sin(time * 9 + x) * 0.18;
      const g = ctx.createRadialGradient(0, 0, size * 0.1, 0, 0, size * 0.62 * pulse);
      g.addColorStop(0, 'rgba(255,196,120,0.85)');
      g.addColorStop(0.55, 'rgba(226,96,60,0.55)');
      g.addColorStop(1, 'rgba(226,96,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.62 * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    if (prod && prod.rare) {
      // RARE 비니 — 금테를 둘러 한눈에 알아보게
      ctx.save();
      ctx.strokeStyle = 'rgba(226,178,92,0.95)';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(226,178,92,0.8)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.42, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    if (im) {
      const s = size * 0.9;
      // 어두운 얼음 배경에서 연한 비니가 묻히지 않게 뒤에 옅은 그림자를 깐다.
      // 타일마다 shadowBlur 를 걸면 폰에서 프레임이 반토막 난다 — 미리 만든 한 장을 찍는다.
      if (shadowSprite) {
        const q = size * 1.02;
        ctx.drawImage(shadowSprite, -q / 2, -q / 2 + size * 0.06, q, q);
      }
      ctx.drawImage(im, -s / 2, -s / 2, s, s);
    } else {
      ctx.fillStyle = '#CFE7EE';
      ctx.fillRect(-size * 0.35, -size * 0.35, size * 0.7, size * 0.7);
    }

    if (t.fire > 0) {
      // 눈에 불 — 두 점이 이글거린다
      const f = 0.7 + Math.sin(time * 12 + y) * 0.3;
      for (const dx of [-size * 0.13, size * 0.13]) {
        const g2 = ctx.createRadialGradient(dx, size * 0.02, 0, dx, size * 0.02, size * 0.09 * f);
        g2.addColorStop(0, 'rgba(255,255,220,1)');
        g2.addColorStop(0.5, 'rgba(255,150,60,0.95)');
        g2.addColorStop(1, 'rgba(226,96,60,0)');
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.arc(dx, size * 0.02, size * 0.09 * f, 0, Math.PI * 2);
        ctx.fill();
      }
      // 머리 위 불꽃
      ctx.fillStyle = `rgba(255,${150 + Math.sin(time * 14) * 40},60,0.9)`;
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.52 - size * 0.14 * f);
      ctx.quadraticCurveTo(size * 0.1, -size * 0.4, 0, -size * 0.34);
      ctx.quadraticCurveTo(-size * 0.1, -size * 0.4, 0, -size * 0.52 - size * 0.14 * f);
      ctx.fill();
    }

    if (t.ice > 0) {
      // 얼음 덩어리에 갇혔다 — 손으로 못 옮기고 옆에서 깨야 한다
      const q = size * 0.46;
      ctx.save();
      const ig = ctx.createLinearGradient(-q, -q, q, q);
      ig.addColorStop(0, t.ice > 1 ? 'rgba(214,244,252,0.92)' : 'rgba(206,238,248,0.72)');
      ig.addColorStop(0.5, t.ice > 1 ? 'rgba(150,212,232,0.88)' : 'rgba(168,216,234,0.60)');
      ig.addColorStop(1, t.ice > 1 ? 'rgba(206,240,250,0.92)' : 'rgba(198,232,244,0.70)');
      ctx.fillStyle = ig;
      ctx.beginPath();
      ctx.rect(-q, -q, q * 2, q * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 2;
      ctx.stroke();
      // 금 — 두 겹이면 성한 얼음, 한 겹이면 이미 금이 가 있다
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      if (t.ice > 1) {
        ctx.moveTo(-q * 0.5, -q); ctx.lineTo(-q * 0.1, -q * 0.2); ctx.lineTo(q * 0.4, q);
      } else {
        ctx.moveTo(-q, -q * 0.3); ctx.lineTo(0, 0); ctx.lineTo(q, -q * 0.5);
        ctx.moveTo(0, 0); ctx.lineTo(q * 0.2, q);
        ctx.moveTo(0, 0); ctx.lineTo(-q * 0.6, q * 0.8);
      }
      ctx.stroke();
      ctx.restore();
    }

    if (t.special) {
      const R = size * 0.3;
      const pulse = 1 + Math.sin(time * 7) * 0.06;
      // 능력 표시 — 로고보다 이 모양이 먼저 읽혀야 한다
      ctx.strokeStyle = '#2F93AD';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      if (t.special === 'line' || t.special === 'cross') {
        ctx.beginPath(); ctx.moveTo(-size * 0.44, 0); ctx.lineTo(size * 0.44, 0); ctx.stroke();
      }
      if (t.special === 'cross') {
        ctx.beginPath(); ctx.moveTo(0, -size * 0.44); ctx.lineTo(0, size * 0.44); ctx.stroke();
      }
      if (t.special === 'bomb') {
        ctx.beginPath(); ctx.arc(0, 0, size * 0.42 * pulse, 0, Math.PI * 2); ctx.stroke();
      }
      // 팀 로고 배지
      ctx.beginPath();
      ctx.arc(0, 0, R * pulse, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.94)';
      ctx.shadowColor = 'rgba(47,147,173,0.6)';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowColor = 'transparent';
      const lg = CFG.USE_TEAM_LOGOS
        ? ((teamKey && img[`t_${teamKey}`]) || img[`s_${t.special}`])
        : null;
      if (lg) {
        ctx.drawImage(lg, -R * 0.72, -R * 0.72, R * 1.44, R * 1.44);
      } else {
        // 로고를 못 쓸 때 — 얼음 결정 문양으로 대신한다
        ctx.strokeStyle = '#2F93AD';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ang) * R * 0.66, Math.sin(ang) * R * 0.66);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  // ── 한 프레임 ──────────────────────────────────────────────────
  function draw(g, dt, sel) {
    stepFx(dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const sx = shake ? (Math.sin(time * 90) * shake) : 0;
    const sy = shake ? (Math.cos(time * 77) * shake) : 0;

    // 얼음 덩어리 안에 갇힌 화면
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (ice) ctx.drawImage(ice, 0, 0);
    else { ctx.fillStyle = '#0F3A4C'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

    // 금 — 점수가 오를수록 번지고, 크게 터지면 번쩍인다
    const shown = Math.floor(cracks.length * Math.min(1, crackLevel));
    for (let i = 0; i < shown; i++) {
      const cr = cracks[i];
      ctx.save();
      ctx.strokeStyle = `rgba(214,244,252,${0.24 + crackFlash * 0.7})`;
      ctx.lineWidth = cr.w * (1 + crackFlash * 1.6) * dpr;
      ctx.shadowColor = 'rgba(160,230,246,0.9)';
      ctx.shadowBlur = (4 + crackFlash * 16) * dpr;
      ctx.beginPath();
      ctx.moveTo(cr.pts[0][0], cr.pts[0][1]);
      for (let k = 1; k < cr.pts.length; k++) ctx.lineTo(cr.pts[k][0], cr.pts[k][1]);
      ctx.stroke();
      ctx.restore();
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.save();
    ctx.translate(sx, sy);

    // 판 = 얼음을 파낸 공간. 안쪽만 밝아서 비니가 또렷하게 뜬다
    const pad = 9;
    const bw = ts * CFG.COLS + pad * 2;
    const bh2 = ts * CFG.ROWS + pad * 2;
    ctx.save();
    const cav = ctx.createLinearGradient(bx, by - pad, bx + bw, by + bh2);
    cav.addColorStop(0, 'rgba(232,250,255,0.30)');
    cav.addColorStop(0.5, 'rgba(198,236,246,0.20)');
    cav.addColorStop(1, 'rgba(232,250,255,0.28)');
    ctx.fillStyle = cav;
    roundRect(bx - pad, by - pad, bw, bh2, 8);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(226,248,255,0.55)';
    ctx.lineWidth = 1.5;
    roundRect(bx - pad, by - pad, bw, bh2, 8);
    ctx.stroke();

    // ── HEAT — 판 안쪽을 아래에서부터 불이 채운다 ──────────────
    const heat = Math.max(0, Math.min(1, g.heat || 0));
    const fever = (g.fever || 0) > 0;
    if (heat > 0.001 && !fever) {
      const top = by - pad + bh2 * (1 - heat);
      ctx.save();
      roundRect(bx - pad, by - pad, bw, bh2, 8);
      ctx.clip();

      // 몸통 — 아래로 갈수록 진한 불
      const fg = ctx.createLinearGradient(0, top, 0, by - pad + bh2);
      fg.addColorStop(0, `rgba(255,150,70,${0.10 + heat * 0.22})`);
      fg.addColorStop(0.45, `rgba(240,90,50,${0.16 + heat * 0.30})`);

      elMission.textContent = missionText(g);
      // 온도가 내려갈수록 얼음에 금이 번진다
      view.setCrack(1 - Math.max(0, g.temp) / CFG.START_TEMP);
      if (g.over) finish();
    }
    view.draw(g, dt, phase === 'play' && selectable(g) ? sel : null);
    requestAnimationFrame(frame);
  }

  window.__match = {
    game: () => g, phase: () => phase, start, view, cfg: CFG, sfx,
    swapAt: (a, b) => trySwap(g, a, b),
    findMove: () => {
      for (let r = 0; r < CFG.ROWS; r++) {
        for (let c = 0; c < CFG.COLS; c++) {
          if (c + 1 < CFG.COLS && swapMakesMatch(g.grid, { c, r }, { c: c + 1, r })) return [{ c, r }, { c: c + 1, r }];
          if (r + 1 < CFG.ROWS && swapMakesMatch(g.grid, { c, r }, { c, r: r + 1 })) return [{ c, r }, { c, r: r + 1 }];
        }
      }
      return null;
    },
    state: () => ({ phase, score: g.score, left: Math.round(g.left), temp: Math.round(g.temp * 10) / 10,
                    cleared: g.cleared, stage: g.stage, boardPhase: g.phase,
                    specials: g.grid.flat().filter((t) => t && t.special).length,
                    fires: g.grid.flat().filter((t) => t && t.fire > 0).length }),
  };
  requestAnimationFrame(frame);
}

boot();


  };
  __req('main.js');
})();
</script>
